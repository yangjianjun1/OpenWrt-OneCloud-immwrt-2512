name: 构建 OneCloud 固件 最终版测试

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH连接到Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_TAG: v25.12.2
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: onecloud.config
  DIY_P1_SH: op1.sh
  DIY_P2_SH: op2.sh
  DIY_P3_SH: op3.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  CACHE_KEY_PREFIX: immortalwrt-25.12.2-onecloud

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
    - name: 检出代码
      uses: actions/checkout@v4   # 修改：从 @main 改为 @v4

    - name: 打印运行环境信息
      run: |
        echo "==== Runner Info ===="
        uname -a
        free -h
        df -h
        lscpu
        echo "====================="
    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autopoint bzip2 ccache cmake cpio device-tree-compiler fastjar gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3-pyelftools qemu-utils scons texinfo uglifyjs upx-ucl xmlto xxd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        echo "Create swap file..."
        if [ -f /swapfile ]; then
          sudo swapoff /swapfile || true
        fi
        sudo rm -f /swapfile
        sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        sudo sysctl -w vm.swappiness=10
        echo "==== 内存与swap状态 ===="
        free -h
        echo "================================="
    - name: 拉取源码并切换到 v25.12.2
      working-directory: /workdir
      run: |
        set -e
        for i in 1 2 3; do
          git clone $REPO_URL openwrt && break || sleep 30
        done
        cd openwrt
        git fetch --tags --force
        git checkout "$REPO_TAG"
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
        echo "✅ 已切换到: $(git describe --tags 2>/dev/null || git log -1 --oneline)"
    - name: 载入玩客云目标平台文件
      run: |
        [ -e target ] && cp -rf target openwrt/
    - name: 载入自定义软件源与执行op1脚本
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
    - name: 更新软件源
      run: cd openwrt && ./scripts/feeds update -a

    - name: 清理无用软件源（op3脚本）
      run: |
        chmod +x $DIY_P3_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P3_SH
    - name: 二次更新软件源
      run: cd openwrt && ./scripts/feeds update -a

    - name: 安装软件源包
      run: cd openwrt && ./scripts/feeds install -a

    - name: 锁定 feeds 到 25.12 稳定分支
      run: |
        cd openwrt
        for feed in feeds/packages feeds/luci feeds/routing feeds/telephony; do
          if [ -d "$feed/.git" ]; then
            git -C "$feed" fetch --tags
            git -C "$feed" checkout origin/openwrt-25.12 2>/dev/null || echo "⚠️ $feed 无 openwrt-25.12 分支，跳过锁定"
          fi
        done
        echo "✅ feeds 锁定完成"
    - name: 载入配置文件与执行op2脚本
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
    - name: 恢复ccache缓存
      uses: actions/cache@v4.2.1   # 修改：升级到支持 Node.js 22/24 的版本
      with:
        path: /workdir/openwrt/.ccache
        key: ${{ env.CACHE_KEY_PREFIX }}-ccache-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          ${{ env.CACHE_KEY_PREFIX }}-ccache-${{ github.ref_name }}-
          ${{ env.CACHE_KEY_PREFIX }}-ccache-
    - name: 恢复dl源码缓存
      uses: actions/cache@v4.2.1   # 修改：同上
      with:
        path: /workdir/openwrt/dl
        key: ${{ env.CACHE_KEY_PREFIX }}-dl-${{ github.ref_name }}
        restore-keys: |
          ${{ env.CACHE_KEY_PREFIX }}-dl-
    - name: 开启SSH调试连接
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: 预下载源码包
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec rm -f {} \;
        echo "✅ 预下载完成"
    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        export CCACHE_DIR=$PWD/.ccache
        export CCACHE_MAXSIZE=10G
        ccache -z
        make -j$(nproc) V=s || make -j1 V=s
        ccache -s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
    - name: 生成可直接烧录镜像
      run: |
        chmod +x $GITHUB_WORKSPACE/Scripts/convert2.sh
        $GITHUB_WORKSPACE/Scripts/convert2.sh
    - name: 整理产物、清理空文件、生成校验和
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        find . -type f -size 0 -delete
        find . -maxdepth 1 -type f ! -name "sha256sums.txt" -print0 | sort -z | xargs -0 sha256sum > sha256sums.txt
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
    - name: 生成当前时间标签
      if: steps.compile.outputs.status == 'success'
      run: echo "FILE_DATE=$(TZ='Asia/Shanghai' date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

    - name: 上传固件到Release
      uses: softprops/action-gh-release@v2.5.0   # 修改：升级到修复 Node 24 警告的版本
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TZ: Asia/Shanghai
      with:
        tag_name: OneCloud-${{ env.FILE_DATE }}
        name: OneCloud-${{ env.FILE_DATE }}
        files: |
          ${{ env.FIRMWARE }}/*
        fail_on_unmatched_files: false
        draft: false

    - name: Telegram 编译成功通知
      if: steps.compile.outputs.status == 'success'
      continue-on-error: true
      run: |
        curl -s --connect-timeout 10 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
        -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
        -d "text=✅ OneCloud固件编译成功！版本: v24.10.6 标签: OneCloud-${{ env.FILE_DATE }}" || true
    - name: Telegram 编译失败通知
      if: failure()
      continue-on-error: true
      run: |
        curl -s --connect-timeout 10 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
        -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
        -d "text=❌ OneCloud固件编译失败！RunID:${{ github.run_id }}" || true
